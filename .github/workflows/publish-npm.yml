name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          # A prerelease version (0.7.0-rc.1) publishes under `next`, never
          # `latest`, so the GitHub prerelease flag must agree with it. Absent on
          # workflow_dispatch, where the version alone decides.
          case "$version" in *-*) is_pre=true ;; *) is_pre=false ;; esac
          if [ -n "$RELEASE_PRERELEASE" ]; then
            test "$RELEASE_PRERELEASE" = "$is_pre"
          fi
          if [ "$is_pre" = true ]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename))")"
          tarball="$PWD/$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" "$tarball"
          "$prefix/node_modules/.bin/nib" doctor
      - name: Publish with npm Trusted Publishing
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@amenski/nib@$version" version --json >/dev/null 2>&1; then
            registry_tarball="$(mktemp)"
            curl --fail --silent --show-error --location "$(npm view "@amenski/nib@$version" dist.tarball)" --output "$registry_tarball"
            registry_integrity="$(npm view "@amenski/nib@$version" dist.integrity)"
            download_integrity="$(node -e "const { createHash } = require('node:crypto'); const { readFileSync } = require('node:fs'); process.stdout.write('sha512-' + createHash('sha512').update(readFileSync(process.argv[1])).digest('base64'))" "$registry_tarball")"
            test "$download_integrity" = "$registry_integrity"
            local_files="$(mktemp -d)"
            registry_files="$(mktemp -d)"
            tar -xzf "$TARBALL" -C "$local_files"
            tar -xzf "$registry_tarball" -C "$registry_files"
            diff -qr "$local_files" "$registry_files"
            echo "@amenski/nib@$version matches the manual bootstrap package contents; not republishing."
          else
            npm publish "$TARBALL" --provenance --tag "$NPM_DIST_TAG"
          fi
