name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          tarball="$(npm pack --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename))")"
          tarball="$PWD/$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" "$tarball"
          "$prefix/node_modules/.bin/nib" doctor
      - name: Publish with npm Trusted Publishing
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@amenski/nib@$version" version --json >/dev/null 2>&1; then
            local_integrity="$(node -e "const { createHash } = require('node:crypto'); const { readFileSync } = require('node:fs'); process.stdout.write('sha512-' + createHash('sha512').update(readFileSync(process.argv[1])).digest('base64'))" "$TARBALL")"
            registry_integrity="$(npm view "@amenski/nib@$version" dist.integrity)"
            test "$local_integrity" = "$registry_integrity"
            echo "@amenski/nib@$version matches the manual bootstrap tarball; not republishing."
          else
            npm publish "$TARBALL" --provenance
          fi
