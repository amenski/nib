name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename))")"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" "$PWD/$tarball"
          "$prefix/node_modules/.bin/nib" doctor
