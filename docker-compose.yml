# Optional local SearXNG instance — nib's self-hosted search backend.
#
# Bing RSS remains the keyless default; this compose is an additive
# convenience. The instance binds to 127.0.0.1 ONLY (localhost), so it is
# not reachable from your LAN. See README.md § "Better search (optional)"
# and docs/web-search-spec.md for the full story.
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # The shipped settings.yml is a read-only TEMPLATE (placeholder
    # secret_key, never mutated, safe to commit). On every start the guard
    # renders it to a container-local file with a fresh random secret and
    # points SearXNG at it via SEARXNG_SETTINGS_PATH — no live secret ever
    # touches the host tree, and the secret rotating per start is harmless
    # for a local single-user instance. (Env-value substitution in
    # settings.yml does not exist in this image — verified 2026-08-15.)
    entrypoint:
      - /bin/sh
      - -c
      - >-
        umask 077;
        SECRET=$$(python3 -c "import secrets; print(secrets.token_hex(32))");
        sed "s/CHANGE_ME_RUN_openssl_rand_hex_32/$${SECRET}/" /etc/searxng/settings.yml > /tmp/searxng-settings.yml;
        export SEARXNG_SETTINGS_PATH=/tmp/searxng-settings.yml;
        exec /usr/local/searxng/entrypoint.sh
