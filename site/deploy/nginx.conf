# Nib site: static Astro build in /opt/nib, served at https://nib.emuye.dev behind Cloudflare.
# Adapted from the VaultIt site's config. Compare it with the live server block before
# installing: the TLS lines (certbot or Cloudflare origin certificate) and the root path
# must match what is deployed. No inline <script> exists in the built pages; if one is
# added, extend the Content-Security-Policy or it will be blocked.
# nginx 1.24 needs "listen 443 ssl http2;" ("http2 on;" only exists from 1.25.1).

server {
    server_name nib.emuye.dev;
    server_tokens off;

    root /opt/nib;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Astro puts hashed, never-changing files in /_astro/
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Unhashed images: cache for a week
    location ~* ^/(social-preview\.png$|prompt-screen\.png$) {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        # One URL per page: /blog/ -> /blog (matches the sitemap)
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri/index.html $uri.html =404;
    }

    listen 443 ssl http2;
    # ssl_certificate / ssl_certificate_key: as on the live server.
}

# Plain HTTP goes straight to HTTPS in one hop.
server {
    listen 80;
    server_name nib.emuye.dev;
    server_tokens off;
    return 301 https://nib.emuye.dev$request_uri;
}
